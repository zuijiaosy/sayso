name: "Release"

# Publishes v<version from tauri.conf.json> with installers attached.
#
# The release is created as a draft, the installers are built and uploaded to
# it, and only when every platform succeeded is it given its notes and
# published. A failed build leaves a draft behind instead of a public release
# with missing downloads.
#
# Binaries are unsigned, matching main-build.yml: the repository has no
# Apple/Azure signing secrets, and build.yml fails at the certificate import
# when sign-binaries is true without them.

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            // Refuse to reuse a version: bump tauri.conf.json, Cargo.toml and
            // package.json before releasing again.
            const existing = await github.rest.git
              .getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` })
              .then(() => true, (error) => (error.status === 404 ? false : Promise.reject(error)));
            if (existing) core.setFailed(`Tag ${tag} already exists`);
            if (existing) return;

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Sayso ${tag}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            return data.id;

  publish-tauri:
    name: "Build ${{ matrix.name }}"
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS ARM64"
            platform: "macos-26"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - name: "Windows x64"
            platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            # No --target: the Windows host toolchain already builds x64.
            args: ""
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "sayso"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  publish-release:
    name: "Publish release"
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Add install notes and publish
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });

            const notes = [
              "## 下载 / Downloads",
              "",
              "| 平台 Platform | 文件 File |",
              "| --- | --- |",
              "| macOS Apple Silicon (M1+) | `.dmg` |",
              "| Windows x64 | `.msi` 或 / or `-setup.exe` |",
              "",
              "## 安装说明",
              "",
              "安装包未经签名公证。",
              "",
              "- **macOS**：把 `Sayso.app` 拖进「应用程序」，确认下载来自本仓库后，在终端执行 `xattr -cr /Applications/Sayso.app`，再打开。首次运行按提示授予**麦克风**、**辅助功能**、**输入监控**权限；并在 系统设置 → 键盘 → 「按下 🌐 键时」选择**不执行任何操作**。",
              "- **Windows**：没有 Authenticode 签名，首次运行 SmartScreen 会拦截，点「更多信息」→「仍要运行」。",
              "- **从 Voiceless 升级**：首次启动会把 `com.voiceless.desktop` 的设置、历史、录音和已下载模型迁移到 `com.sayso.desktop`，无需重新下载；macOS 权限需要重新授予一次。",
              "",
              "## Install notes",
              "",
              "The installers are not signed or notarized.",
              "",
              "- **macOS**: move `Sayso.app` to Applications, confirm the download came from this repository, run `xattr -cr /Applications/Sayso.app`, then open it. Grant **Microphone**, **Accessibility** and **Input Monitoring** when asked, and set System Settings → Keyboard → \"Press 🌐 key to\" → **Do Nothing**.",
              "- **Windows**: there is no Authenticode signature, so SmartScreen warns on first run — choose \"More info\" → \"Run anyway\".",
              "- **Upgrading from Voiceless**: on first launch settings, history, recordings and downloaded models move from `com.voiceless.desktop` to `com.sayso.desktop`; macOS permissions must be granted once more.",
            ].join("\n");

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id,
              body: `${notes}\n\n${release.body ?? ""}`.trim(),
              draft: false,
              make_latest: "true",
            });
            core.notice(`Published ${release.tag_name}`);
