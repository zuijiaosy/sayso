name: "Release"

# Every push to main builds macOS ARM64 and Windows x64 installers and publishes
# them as a GitHub release, with notes listing the commits since the previous
# release (scripts/release-notes.sh). Put "[skip release]" in the commit
# message to push without releasing; workflow_dispatch releases on demand.
#
# Version: major.minor come from tauri.conf.json; the patch number counts up
# from this repository's latest published vX.Y.* release. Bump tauri.conf.json
# (and Cargo.toml, package.json) to 0.4.0 to start the 0.4 series. The version
# is read from GitHub releases rather than git tags because the local clone
# also carries upstream Handy's tags, whose numbers overlap ours.
#
# The release is created as a draft, the installers are built and uploaded to
# it, and only when every platform succeeded is it given its notes and
# published. A failed build leaves a draft behind instead of a public release
# with missing downloads; the next run replaces it.
#
# No Apple/Azure signing: the repository has no such secrets, and build.yml
# fails at the certificate import when sign-binaries is true without them.
# macOS builds are instead signed with the self-signed "Sayso Release"
# certificate (self-sign-macos, secrets SAYSO_SIGNING_P12 and
# SAYSO_SIGNING_P12_PASSWORD), so every release carries the same signature and
# installs over the previous one without losing permissions. They are still
# not notarized.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        shell: bash
        run: |
          base=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          major_minor="${base%.*}"
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName -q '.[].tagName')
          last=$(grep -E "^v${major_minor//./\\.}\\.[0-9]+$" <<<"$published" | sort -V | tail -1 || true)
          if [ -n "$last" ]; then
            version="${major_minor}.$(( ${last##*.} + 1 ))"
          else
            version="$base"
          fi
          previous=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$published" | sort -V | tail -1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous: ${previous:-none})"

      - name: Create draft release
        id: create-release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          tag="v$VERSION"
          # A failed run leaves its draft behind; replace it.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          if [ -n "$PREVIOUS" ] && git rev-parse -q --verify "refs/tags/$PREVIOUS" >/dev/null; then
            scripts/release-notes.sh "$PREVIOUS" > "$RUNNER_TEMP/notes.md"
          else
            echo "" > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Sayso $tag" \
            -F draft=true -F prerelease=false -F body=@"$RUNNER_TEMP/notes.md" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: "Build ${{ matrix.name }}"
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS ARM64"
            platform: "macos-26"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - name: "Windows x64"
            platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            # No --target: the Windows host toolchain already builds x64.
            args: ""
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      self-sign-macos: true
      app-version: ${{ needs.create-release.outputs.version }}
      asset-prefix: "sayso"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  publish-release:
    name: "Publish release"
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Add install notes and publish
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });

            const notes = [
              "## 下载 / Downloads",
              "",
              "| 平台 Platform | 文件 File |",
              "| --- | --- |",
              "| macOS Apple Silicon (M1+) | `.dmg` |",
              "| Windows x64 | `.msi` 或 / or `-setup.exe` |",
              "",
              "## 安装说明",
              "",
              "安装包未经签名公证。",
              "",
              "- **macOS**：把 `Sayso.app` 拖进「应用程序」，确认下载来自本仓库后，在终端执行 `xattr -cr /Applications/Sayso.app`，再打开。首次运行按提示授予**麦克风**、**辅助功能**、**输入监控**权限；并在 系统设置 → 键盘 → 「按下 🌐 键时」选择**不执行任何操作**。",
              "- **Windows**：没有 Authenticode 签名，首次运行 SmartScreen 会拦截，点「更多信息」→「仍要运行」。",
              "- **更新**：在 设置 → 关于 里点「检查更新」，下载新版后直接覆盖安装。0.2.0 之后的版本都用同一张证书签名，覆盖后权限保持不变；从 0.2.0 及更早版本升级时需要重新授权一次。",
              "- **从 Voiceless 升级**：首次启动会把 `com.voiceless.desktop` 的设置、历史、录音和已下载模型迁移到 `com.sayso.desktop`，无需重新下载；macOS 权限需要重新授予一次。",
              "",
              "## Install notes",
              "",
              "The installers are not signed or notarized.",
              "",
              "- **macOS**: move `Sayso.app` to Applications, confirm the download came from this repository, run `xattr -cr /Applications/Sayso.app`, then open it. Grant **Microphone**, **Accessibility** and **Input Monitoring** when asked, and set System Settings → Keyboard → \"Press 🌐 key to\" → **Do Nothing**.",
              "- **Windows**: there is no Authenticode signature, so SmartScreen warns on first run — choose \"More info\" → \"Run anyway\".",
              "- **Updating**: Settings → About → Check for updates, then install the new build over the old one. Every release after 0.2.0 is signed with the same certificate, so permissions carry over; upgrading from 0.2.0 or earlier needs them granted once more.",
              "- **Upgrading from Voiceless**: on first launch settings, history, recordings and downloaded models move from `com.voiceless.desktop` to `com.sayso.desktop`; macOS permissions must be granted once more.",
            ].join("\n");

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id,
              body: `${notes}\n\n${release.body ?? ""}`.trim(),
              draft: false,
              make_latest: "true",
            });
            core.notice(`Published ${release.tag_name}`);
