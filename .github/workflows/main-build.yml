name: "Main Branch Build"

# Builds the macOS and Windows installers on every push to main so each commit
# has a downloadable build. Artifacts are kept for 30 days.
#
# Binaries are unsigned: macOS gets Tauri's ad-hoc signature ("-" in
# tauri.conf.json), Windows gets no Authenticode signature. Signing needs the
# Apple/Azure secrets consumed by build.yml when sign-binaries is true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "voiceless"
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
