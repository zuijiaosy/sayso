name: "Main Branch Build"

# Builds the macOS Apple Silicon installer on every push to main so each commit
# has a downloadable build. Artifacts are kept for 30 days.
#
# Binaries are unsigned: macOS gets Tauri's ad-hoc signature ("-" in
# tauri.conf.json), Windows gets no Authenticode signature. Signing needs the
# Apple/Azure secrets consumed by build.yml when sign-binaries is true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build macOS ARM64"
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin"
      asset-prefix: "voiceless"
      upload-artifacts: true
      sign-binaries: false
      no-cache: false
    secrets: inherit

  usage-notes:
    name: "Download and install notes"
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Add build summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Voiceless installers

          Download the macOS Apple Silicon installer from the **Artifacts** section of this workflow run.

          The GitHub Actions builds are unsigned. After moving the macOS app to `/Applications`, verify that it came from this repository, then run:

          ```bash
          xattr -cr /Applications/Voiceless.app
          ```
          EOF
          echo "Build result: ${BUILD_RESULT}" >> "$GITHUB_STEP_SUMMARY"
