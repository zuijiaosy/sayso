name: "Main Branch Build"

# Builds the macOS and Windows installers on every push to main so each commit
# has a downloadable build. Artifacts are kept for 30 days.
#
# Binaries are unsigned: macOS gets Tauri's ad-hoc signature ("-" in
# tauri.conf.json), Windows gets no Authenticode signature. Signing needs the
# Apple/Azure secrets consumed by build.yml when sign-binaries is true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "voiceless"
      upload-artifacts: true
      sign-binaries: false
      no-cache: false
    secrets: inherit

  usage-notes:
    name: "Download and install notes"
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Add build summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Voiceless installers

          Download the macOS and Windows installers from the **Artifacts** section of this workflow run.

          The GitHub Actions builds are unsigned. After moving the macOS app to `/Applications`, verify that it came from this repository, then run:

          ```bash
          xattr -cr /Applications/Voiceless.app
          ```
          EOF
          echo "Build result: ${BUILD_RESULT}" >> "$GITHUB_STEP_SUMMARY"
