name: "Main Branch Build"

# Builds the macOS Apple Silicon and Windows x64 installers on every push to
# main so each commit has a downloadable build. Artifacts are kept for 30 days.
#
# Binaries are unsigned: macOS gets Tauri's ad-hoc signature ("-" in
# tauri.conf.json), Windows gets no Authenticode signature. Signing needs the
# Apple/Azure secrets consumed by build.yml when sign-binaries is true.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build ${{ matrix.name }}"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS ARM64"
            platform: "macos-26"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - name: "Windows x64"
            platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            # No --target: the Windows host toolchain already builds x64, and
            # build.yml skips `rustup target add` for this triple.
            args: ""
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "sayso"
      upload-artifacts: true
      sign-binaries: false
      no-cache: false
    secrets: inherit

  usage-notes:
    name: "Download and install notes"
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Add build summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Sayso installers

          Download them from the **Artifacts** section of this workflow run:

          | Artifact | Contents |
          | --- | --- |
          | `sayso-aarch64-apple-darwin` | macOS Apple Silicon `.dmg` and `.app` |
          | `sayso-x86_64-pc-windows-msvc` | Windows x64 `.msi` and NSIS `.exe` |

          The GitHub Actions builds are unsigned. After moving the macOS app to `/Applications`, verify that it came from this repository, then run:

          ```bash
          xattr -cr /Applications/Sayso.app
          ```

          Windows has no Authenticode signature, so SmartScreen will warn on first run.
          EOF
          echo "Build result: ${BUILD_RESULT}" >> "$GITHUB_STEP_SUMMARY"
