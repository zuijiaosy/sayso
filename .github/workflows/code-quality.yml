name: "code quality"
on:
  # Runs on pull requests, and on every push to main as the first stage of
  # release.yml (workflow_call), so a push starts one workflow, not several.
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
