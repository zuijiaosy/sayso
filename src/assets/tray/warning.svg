    <rect x="4" y="9" width="56" height="38" rx="12" fill="#fff" />
    <path d="M16 36 L7.5 59 Q6 62.5 9.5 60.5 L32 47 Z" fill="#fff" />
    <path d="M20 27 L27.5 34.5 L45 17" fill="none" stroke="#000" stroke-width="7"
      stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="49" cy="49" r="13.5" fill="#000" />
    <circle cx="49" cy="49" r="10.5" fill="#fff" />
    <path d="M49 43.5 L49 50" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" />
    <circle cx="49" cy="54" r="1.9" fill="#000" />
  </mask>
  <rect width="64" height="64" fill="currentColor" mask="url(#m)" />
</svg>
