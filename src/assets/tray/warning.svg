<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Idle glyph plus a badge. The badge is separated from the bubble by a
       transparent gap ring so the two shapes stay distinct once macOS flattens
       this to a template (alpha-only) icon. -->
